[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opent5"
version = "0.1.0"
description = "Open, browse, edit and rebuild Black Ops (T5) PS3 fastfiles"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "setsid" }]
dependencies = ["numpy==2.2.6", "PyNaCl==1.5.0", "cffi==2.1.1", "pycparser==3.0"]

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.8.1", "shiboken6==6.8.1"]

[project.scripts]
opent5 = "opent5.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["zones: needs the real zones named in .env", "slow: takes minutes"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
